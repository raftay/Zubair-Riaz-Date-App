<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zubair Riaz Premium Dates</title>
  </head>
  <body>
    <div class="grain" id="grain"></div>
    <div class="vignette"></div>

    <header class="nav" id="nav">
      <a class="brand" href="#">
        <span class="brand__mark" data-icon="seed"></span>
        <span class="brand__word">
          <span class="brand__name">Zubair Riaz</span>
          <span class="brand__sub">Premium Dates</span>
        </span>
      </a>
      <nav class="nav__links">
        <i data-sq="label" data-w="4.4" data-seed="21"></i>
        <i data-sq="label" data-w="5.6" data-seed="22"></i>
        <i data-sq="label" data-w="4" data-seed="23"></i>
        <i data-sq="label" data-w="5" data-seed="24"></i>
        <i data-sq="label" data-w="3.8" data-seed="25"></i>
      </nav>
      <div class="nav__actions">
        <span data-icon="search"></span>
        <span data-icon="user"></span>
        <span class="nav__bag" data-icon="bag"><b></b></span>
        <a class="btn btn--ghost btn--sm"><i data-sq="label" data-w="4.6" data-seed="26"></i></a>
      </div>
    </header>

    <aside class="chapters" id="chapters">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </aside>

    <main>
      <!-- 01 · HERO  +  02 · THE DATE BECOMES THE SEED (one pinned stage) -->
      <section class="hero" id="hero" data-scene data-ink="#f7f0e3" data-navbg="dark" data-chapter="0">
        <div class="hero__stage">
          <div class="hero__photo">
            <img class="hero__plate" src="/img/zubair-plate.webp" alt="" />
            <div class="hero__bgclip">
              <div class="hero__bg">
                <canvas class="hero__fronds"></canvas>
                <div class="hero__beam"></div>
                <div class="hero__glow"></div>
                <svg class="hero__arch" viewBox="0 0 660 900" preserveAspectRatio="xMidYMax meet">
                  <path pathLength="1" d="M10 900 V340 C10 175 205 70 330 10 C455 70 650 175 650 340 V900" />
                  <path pathLength="1" d="M34 900 V346 C34 196 214 98 330 40 C446 98 626 196 626 346 V900" />
                </svg>
              </div>
            </div>
            <div class="hero__person"><img src="/img/zubair-person.webp" alt="" /></div>
          </div>
          <div class="date__glow"></div>
          <canvas class="hero__dust"></canvas>
          <span class="hero__glint"></span>
          <svg class="date__orbit" viewBox="-500 -160 1000 320">
            <ellipse class="date__orbit-ring" rx="420" ry="112" pathLength="1" />
            <ellipse class="date__orbit-ticks" rx="452" ry="122" pathLength="1" />
          </svg>
          <canvas class="date__gl"></canvas>
          <svg class="date__trail">
            <path class="date__trail-glow" />
            <path class="date__trail-core" />
            <g class="seedglyph">
              <circle class="seedglyph__halo" r="22" />
              <ellipse class="seedglyph__body" rx="7.1" ry="14.4" />
              <path class="seedglyph__groove" d="M0 -11 Q1.2 0 0 11" />
            </g>
          </svg>

          <div class="hero__content">
            <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="12" data-seed="31"></i></div>
            <i class="hero__title" data-sq="display" data-w="36" data-lines="2" data-seed="32" data-last="0.7"></i>
            <i class="hero__body" data-sq="body" data-w="27" data-lines="3" data-seed="33"></i>
            <div class="hero__ctas">
              <a class="btn btn--gold"><i data-sq="label" data-w="7" data-seed="34"></i><span data-icon="arrow"></span></a>
              <a class="btn btn--ghost"><i data-sq="label" data-w="7.5" data-seed="35"></i></a>
            </div>
            <ul class="features">
              <li><span data-icon="palm"></span><i data-sq="label" data-w="6" data-seed="36"></i></li>
              <li><span data-icon="drop"></span><i data-sq="label" data-w="6.5" data-seed="37"></i></li>
              <li><span data-icon="globe"></span><i data-sq="label" data-w="5.5" data-seed="38"></i></li>
            </ul>
          </div>

          <!-- product moment: the Ajwa date -->
          <div class="date-ui date-ui--product">
            <div class="date-ui__left">
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="9" data-seed="141"></i></div>
              <i data-sq="display" data-w="27" data-lines="2" data-seed="142" data-last="0.55"></i>
              <i class="date-ui__body" data-sq="body" data-w="22" data-lines="3" data-seed="143"></i>
            </div>
            <ul class="date-ui__specs">
              <li><span data-icon="palm"></span><div><i data-sq="label" data-w="6.5" data-seed="144"></i><i data-sq="body" data-w="12" data-lines="2" data-seed="145"></i></div></li>
              <li><span data-icon="sun"></span><div><i data-sq="label" data-w="5.5" data-seed="146"></i><i data-sq="body" data-w="12" data-lines="2" data-seed="147"></i></div></li>
              <li><span data-icon="leaf"></span><div><i data-sq="label" data-w="7" data-seed="148"></i><i data-sq="body" data-w="12" data-lines="2" data-seed="149"></i></div></li>
            </ul>
          </div>

          <div class="hero__cue">
            <span class="mouse"><b></b></span>
            <i data-sq="label" data-w="5" data-seed="39"></i>
          </div>
        </div>
      </section>

      <!-- the seed falls through the dark on the golden thread -->
      <section class="bridge" id="bridge" data-scene data-ink="#f7f0e3" data-navbg="dark" data-chapter="1"></section>

      <!-- 03 · PLANTING  +  04 · GROWTH (one continuous pinned shot) -->
      <section class="growth" id="growth" data-scene data-cover data-navbg="none" data-chapter="2">
        <div class="growth__stage">
          <canvas class="growth__canvas"></canvas>
          <div class="growth__ui">
            <div class="s-head">
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="9" data-seed="91"></i></div>
              <i data-sq="title" data-w="28" data-lines="2" data-seed="92" data-last="0.5"></i>
              <i class="s-head__body" data-sq="body" data-w="23" data-lines="3" data-seed="93"></i>
            </div>

            <div class="s-card" id="card-moist">
              <span class="s-card__lead"></span>
              <div class="s-card__head"><span data-icon="drop"></span><i data-sq="label" data-w="6" data-seed="94"></i></div>
              <svg class="s-card__meter" viewBox="0 0 200 26"></svg>
              <i data-sq="body" data-w="10.5" data-lines="1" data-seed="95"></i>
            </div>
            <div class="s-card" id="card-ph">
              <span class="s-card__lead"></span>
              <div class="s-card__head"><span data-icon="flask"></span><i data-sq="label" data-w="4.5" data-seed="96"></i></div>
              <svg class="s-card__gauge" viewBox="0 0 200 92">
                <defs>
                  <linearGradient id="phGrad" x1="0" x2="1">
                    <stop offset="0" stop-color="#d0643a" /><stop offset="0.35" stop-color="#e3b44e" />
                    <stop offset="0.6" stop-color="#8fb05a" /><stop offset="1" stop-color="#4f8a9a" />
                  </linearGradient>
                </defs>
                <path class="arc" d="M24 84 A76 76 0 0 1 176 84" pathLength="1" />
                <line class="needle" x1="100" y1="84" x2="100" y2="22" />
                <circle class="hub" cx="100" cy="84" r="6" />
              </svg>
              <i data-sq="body" data-w="10" data-lines="1" data-seed="97"></i>
            </div>
            <div class="s-card" id="card-min">
              <span class="s-card__lead"></span>
              <div class="s-card__head"><span data-icon="gem"></span><i data-sq="label" data-w="6.5" data-seed="98"></i></div>
              <div class="s-card__donut">
                <svg viewBox="0 0 100 100"><g class="donut"></g></svg>
                <ul>
                  <li><b style="--c:#e3b44e"></b><i data-sq="label" data-w="3.6" data-seed="101"></i></li>
                  <li><b style="--c:#b97a3c"></b><i data-sq="label" data-w="4.2" data-seed="102"></i></li>
                  <li><b style="--c:#8fa66a"></b><i data-sq="label" data-w="3.2" data-seed="103"></i></li>
                  <li><b style="--c:#d9cbb0"></b><i data-sq="label" data-w="3.8" data-seed="104"></i></li>
                </ul>
              </div>
            </div>

            <div class="g-head">
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="10" data-seed="51"></i></div>
              <i data-sq="title" data-w="30" data-lines="2" data-seed="52" data-last="0.6"></i>
              <i class="g-head__body" data-sq="body" data-w="24" data-lines="3" data-seed="53"></i>
            </div>

            <div class="g-rail">
              <div class="g-rail__line"><b></b></div>
              <div class="g-rail__node" style="--xf: 0"><span data-icon="seed"></span><i data-sq="label" data-w="4.5" data-seed="61"></i></div>
              <div class="g-rail__node" style="--xf: 0.3333"><span data-icon="sprout"></span><i data-sq="label" data-w="5" data-seed="62"></i></div>
              <div class="g-rail__node" style="--xf: 0.6667"><span data-icon="sapling"></span><i data-sq="label" data-w="4.2" data-seed="63"></i></div>
              <div class="g-rail__node" style="--xf: 1"><span data-icon="palmDates"></span><i data-sq="label" data-w="5.2" data-seed="64"></i></div>
            </div>

            <div class="g-card g-card--left" id="card-height">
              <span class="g-card__lead"></span>
              <div class="g-card__head"><span data-icon="ruler"></span><i data-sq="label" data-w="6.5" data-seed="71"></i></div>
              <svg class="g-card__bars" viewBox="0 0 200 64"></svg>
              <i data-sq="body" data-w="11" data-lines="1" data-seed="72"></i>
            </div>
          </div>
        </div>
      </section>

      <!-- 05 · WATER (slides over the pinned growth stage) -->
      <section class="water sheet" id="water" data-scene data-cover data-ink="#2a1a10" data-navbg="none" data-chapter="4">
        <div class="water__stage">
          <canvas class="water__canvas"></canvas>
          <div class="water__ui">
            <div class="w-head">
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="8.5" data-seed="201"></i></div>
              <i data-sq="title" data-w="27" data-lines="2" data-seed="202" data-last="0.55"></i>
              <i class="w-head__body" data-sq="body" data-w="22" data-lines="2" data-seed="203"></i>
            </div>
            <div class="w-card" id="card-water">
              <div class="w-card__head"><span data-icon="drop"></span><i data-sq="label" data-w="7" data-seed="231"></i></div>
              <svg class="w-spark" viewBox="0 0 200 64">
                <path class="area" />
                <path class="line" pathLength="1" />
                <circle class="dot" r="4.5" />
              </svg>
              <i data-sq="body" data-w="11.5" data-lines="1" data-seed="232"></i>
            </div>
          </div>
        </div>
      </section>

      <!-- 06 · RIPENING (slides over the pinned water stage) -->
      <section class="ripen sheet" id="ripen" data-scene data-cover data-ink="#2a1a10" data-navbg="none" data-chapter="5">
        <div class="ripen__stage">
          <canvas class="ripen__bg"></canvas>
          <canvas class="ripen__gl"></canvas>
          <div class="ripen__panels">
            <article class="ripen__panel">
              <span class="ripen__chip" style="--c: #6f8a33"></span>
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="7" data-seed="300"></i></div>
              <i data-sq="display" data-w="25" data-lines="2" data-seed="301" data-last="0.5"></i>
              <i class="ripen__body" data-sq="body" data-w="21" data-lines="3" data-seed="302"></i>
              <ul class="ripen__meters">
                <li><span data-icon="sun"></span><i data-sq="label" data-w="4.2" data-seed="303"></i><span class="ripen__meter"><b></b></span></li>
                <li><span data-icon="drop"></span><i data-sq="label" data-w="4.6" data-seed="304"></i><span class="ripen__meter"><b></b></span></li>
                <li><span data-icon="leaf"></span><i data-sq="label" data-w="3.8" data-seed="305"></i><span class="ripen__meter"><b></b></span></li>
              </ul>
            </article>
          </div>
          <div class="ripen__rail">
            <div class="ripen__rail-line"><b></b></div>
            <div class="ripen__node" style="--xf: 0; --c: #6f8a33"><span></span><i data-sq="label" data-w="4" data-seed="350"></i></div>
            <div class="ripen__node" style="--xf: 0.3333; --c: #e0ad3a"><span></span><i data-sq="label" data-w="4.6" data-seed="351"></i></div>
            <div class="ripen__node" style="--xf: 0.6667; --c: #9a5a24"><span></span><i data-sq="label" data-w="4.2" data-seed="352"></i></div>
            <div class="ripen__node" style="--xf: 1; --c: #2a140c"><span></span><i data-sq="label" data-w="3.8" data-seed="353"></i></div>
          </div>
        </div>
      </section>

      <!-- 07 · HARVEST + 08 · PACKAGING (one studio shot; slides over ripening) -->
      <section class="harvest sheet" id="harvest" data-scene data-ink="#f7f0e3" data-navbg="none" data-chapter="6">
        <div class="harvest__stage">
          <canvas class="harvest__bg"></canvas>
          <canvas class="harvest__gl"></canvas>
          <svg class="harvest__lines">
            <path class="h-lead" pathLength="1" />
            <circle class="h-lead-dot" r="4" />
          </svg>
          <span class="h-flash"></span>
          <div class="harvest__ui">
            <div class="h-head">
              <div class="eyebrow"><span class="eyebrow__rule"></span><i data-sq="label" data-w="8" data-seed="501"></i></div>
              <i data-sq="display" data-w="26" data-lines="2" data-seed="502" data-last="0.5"></i>
              <i class="h-head__body" data-sq="body" data-w="21" data-lines="2" data-seed="503"></i>
            </div>
            <div class="h-inspect">
              <div class="h-inspect__head"><span data-icon="search"></span><i data-sq="label" data-w="7" data-seed="511"></i></div>
              <ul>
                <li><span data-icon="ruler"></span><i data-sq="label" data-w="6.2" data-seed="512"></i><svg class="check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" pathLength="1" /></svg></li>
                <li><span data-icon="drop"></span><i data-sq="label" data-w="5.4" data-seed="513"></i><svg class="check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" pathLength="1" /></svg></li>
                <li><span data-icon="sun"></span><i data-sq="label" data-w="6.6" data-seed="514"></i><svg class="check" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" pathLength="1" /></svg></li>
              </ul>
              <div class="h-batch"><svg class="barcode" viewBox="0 0 120 30" preserveAspectRatio="none"></svg><i data-sq="label" data-w="5" data-seed="515"></i></div>
            </div>
            <div class="h-cta">
              <i data-sq="label" data-w="7" data-seed="531"></i>
              <i class="h-cta__price" data-sq="title" data-w="9" data-seed="532"></i>
              <div class="h-cta__row">
                <span class="h-qty"><span data-icon="minus"></span><i data-sq="label" data-w="1.2" data-seed="533"></i><span data-icon="plus"></span></span>
                <a class="btn btn--gold"><i data-sq="label" data-w="6.5" data-seed="534"></i><span data-icon="bag"></span></a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <svg class="thread" id="thread" aria-hidden="true">
      <path class="thread__glow" />
      <path class="thread__core" />
      <g class="seedglyph thread__seed">
        <circle class="seedglyph__halo" r="22" />
        <ellipse class="seedglyph__body" rx="7.1" ry="14.4" />
        <path class="seedglyph__groove" d="M0 -11 Q1.2 0 0 11" />
      </g>
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
